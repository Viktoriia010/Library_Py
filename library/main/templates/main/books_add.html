
{% extends 'main/layout.html' %}

{% block title %}Додати книгу — Bookly{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">

    <div class="mb-8">
        <a href="/" class="text-sm text-forest font-semibold hover:underline">
            ← Назад до каталогу
        </a>

        <h1 class="font-serif text-4xl mt-5 text-gray-900">
            Нова книга
        </h1>
        <p class="text-gray-500 mt-2">Додай нову книгу до бібліотечного каталогу</p>
    </div>

    <div class="bg-white rounded-3xl border border-gray-100 p-8">

        {% if error %}
        <div class="bg-red-50 text-red-600 p-4 rounded-xl mb-5 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-semibold mb-2">Назва книги</label>
                <input type="text" name="name" required placeholder="Наприклад, Маленький принц"
                    class="w-full bg-cream rounded-xl px-4 py-3.5 outline-none focus:ring-2 focus:ring-sage">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Автор</label>
                <input type="text" name="author" required placeholder="Ім'я автора"
                    class="w-full bg-cream rounded-xl px-4 py-3.5 outline-none focus:ring-2 focus:ring-sage">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div>
                    <label class="block text-sm font-semibold mb-2">Рік видання</label>
                    <input type="number" name="year" required placeholder="2024"
                        class="w-full bg-cream rounded-xl px-4 py-3.5 outline-none focus:ring-2 focus:ring-sage">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">Жанр</label>
                    <input type="text" name="genre" required placeholder="Фентезі"
                        class="w-full bg-cream rounded-xl px-4 py-3.5 outline-none focus:ring-2 focus:ring-sage">
                </div>

            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Видавництво</label>
                <input type="text" name="publisher" required placeholder="Назва видавництва"
                    class="w-full bg-cream rounded-xl px-4 py-3.5 outline-none focus:ring-2 focus:ring-sage">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">
                    Кількість примірників
                </label>

                <input
                    type="number"
                    name="copies_count"
                    min="1"
                    value="1"
                    required
                    class="w-full bg-cream rounded-xl px-4 py-3.5">
            </div>

            <div class="bg-cream rounded-xl p-4 flex items-center gap-3">
                <input type="checkbox" name="is_available" checked
                    class="w-5 h-5 accent-[#244C3B]">
                <label class="text-sm font-semibold">
                    Книга є в наявності
                </label>
            </div>

            <div class="flex flex-col sm:flex-row gap-3 pt-3">

                <button type="submit"
                    class="flex-1 bg-forest text-white py-4 rounded-xl font-semibold hover:bg-[#193B2D] transition">
                    + Додати книгу
                </button>

                <a href="/"
                    class="px-7 py-4 rounded-xl border border-gray-200 text-gray-500 text-center font-semibold hover:bg-cream transition">
                    Скасувати
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
