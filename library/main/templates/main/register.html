
{% extends 'main/layout.html' %}

{% block title %}Реєстрація — Bookly{% endblock %}

{% block content %}

<div class="max-w-lg mx-auto py-8">

    <div class="bg-white rounded-3xl border border-gray-100 p-8 md:p-10 shadow-sm">

        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-[#DCE9DF] rounded-2xl flex items-center justify-center text-3xl mx-auto mb-5">
                🌿
            </div>

            <h1 class="font-serif text-3xl text-gray-900">
                Приєднуйся до Bookly
            </h1>

            <p class="text-gray-500 text-sm mt-2">
                Створи акаунт та відкрий світ книг
            </p>
        </div>

        {% if error %}
        <div class="bg-red-50 text-red-600 rounded-xl p-4 text-sm mb-5">
            {{ error }}
        </div>
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <div>
                    <label class="block text-sm font-semibold mb-2">Ім'я</label>
                    <input
                        type="text"
                        name="name"
                        value="{{ data.name|default:'' }}"
                        required
                        placeholder="Марія"
                        class="w-full bg-cream rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sage">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">Прізвище</label>
                    <input
                        type="text"
                        name="surname"
                        value="{{ data.surname|default:'' }}"
                        required
                        placeholder="Коваленко"
                        class="w-full bg-cream rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sage">
                </div>

            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Email</label>
                <input
                    type="email"
                    name="email"
                    value="{{ data.email|default:'' }}"
                    required
                    placeholder="example@gmail.com"
                    class="w-full bg-cream rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sage">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Контактний телефон</label>
                <input
                    type="tel"
                    name="phone"
                    value="{{ data.phone|default:'' }}"
                    required
                    placeholder="+380..."
                    class="w-full bg-cream rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sage">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Логін</label>
                <input
                    type="text"
                    name="username"
                    value="{{ data.username|default:'' }}"
                    required
                    placeholder="Придумай логін"
                    class="w-full bg-cream rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sage">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Пароль</label>
                <input
                    type="password"
                    name="password"
                    required
                    placeholder="Мінімум 8 символів"
                    class="w-full bg-cream rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sage">
            </div>

            <div>
                <label class="block text-sm font-semibold mb-2">Повторіть пароль</label>
                <input
                    type="password"
                    name="password2"
                    required
                    placeholder="Повторіть пароль"
                    class="w-full bg-cream rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-sage">
            </div>

            <button
                type="submit"
                class="w-full bg-forest text-white py-4 rounded-xl font-semibold hover:bg-[#193B2D] transition mt-3">
                Створити акаунт →
            </button>

        </form>

        <p class="text-center text-sm text-gray-500 mt-7">
            Вже маєш акаунт?
            <a href="{% url 'login' %}" class="text-forest font-bold hover:underline">
                Увійти
            </a>
        </p>

    </div>

</div>

{% endblock %}
